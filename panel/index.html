<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#101010">
<meta name="robots" content="noindex">
<title>Panel · Sell-UP</title>
<style>
:root{--bg:#0f0f0f;--s1:#171717;--s2:#202020;--s3:#2a2a2a;--line:#2c2c2c;--fg:#f2f2f2;--mut:#9a9a9a;--acc:#ff7a3d;--ok:#4caf50;--bad:#ff5d5d;color-scheme:dark}
*{box-sizing:border-box}[hidden]{display:none!important}
html,body{margin:0;background:var(--bg);color:var(--fg);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-size:15px;-webkit-font-smoothing:antialiased}
button,input,select{font:inherit;color:inherit}button{cursor:pointer;border:0;background:none;padding:0}
.login{min-height:100vh;display:grid;place-items:center;padding:20px}
.box{width:min(400px,100%);background:var(--s1);border:1px solid var(--line);border-radius:20px;padding:26px}
.box h1{margin:0 0 4px;font-size:26px}.box p{margin:0 0 18px;color:var(--mut)}
label.f{display:block;font-size:13px;color:var(--mut);margin:12px 0 6px}
input.in,select.in{width:100%;padding:11px 13px;border-radius:12px;border:1px solid var(--line);background:var(--s2);font-size:16px}
input.in:focus,select.in:focus{outline:2px solid var(--acc);border-color:transparent}
input[type=color]{width:54px;height:42px;padding:2px;border-radius:10px;border:1px solid var(--line);background:var(--s2);cursor:pointer}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:11px 16px;border-radius:12px;background:var(--acc);color:#1a0d05;font-weight:800;text-decoration:none}
.btn.w{width:100%;margin-top:18px}.btn.g{background:var(--s3);color:var(--fg)}.btn.s{padding:7px 12px;font-size:13px;border-radius:10px}.btn.d{background:#4a2020;color:#ffb0b0}.btn:disabled{opacity:.5}
.err{color:var(--bad);font-size:14px;margin-top:12px;min-height:1.2em}
.top{position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:10px 16px;background:#151515;border-bottom:1px solid var(--line)}
.top h2{margin:0;font-size:18px}.top select{background:var(--s2);border:1px solid var(--line);border-radius:10px;padding:8px 10px}
.top .r{margin-left:auto;display:flex;gap:8px}
.tabs{display:flex;gap:6px;padding:12px 16px 0;max-width:1100px;margin:0 auto;overflow-x:auto}
.tab{padding:9px 15px;border-radius:99px;background:var(--s2);font-weight:700;color:var(--mut);white-space:nowrap}.tab[aria-pressed=true]{background:var(--acc);color:#1a0d05}
main{max-width:1100px;margin:0 auto;padding:12px 16px 90px}
h3{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:22px 0 8px;font-size:13px;letter-spacing:.08em;text-transform:uppercase;color:var(--mut)}
.g2{display:grid;grid-template-columns:repeat(auto-fill,minmax(340px,1fr));gap:8px}
.row{display:flex;align-items:center;gap:10px;background:var(--s1);border:1px solid var(--line);border-radius:14px;padding:9px 12px}
.row.off{opacity:.5}
.row .nm{flex:1;min-width:0;font-weight:600;display:flex;align-items:center;gap:8px}
.dot{width:14px;height:14px;border-radius:50%;flex:none;border:1px solid #fff3}
.pr{display:flex;gap:6px;align-items:center;flex-wrap:wrap;justify-content:flex-end}
.pr label{font-size:11px;color:var(--mut);display:flex;flex-direction:column;gap:2px;align-items:center}
.pr input{width:64px;padding:7px 5px;border-radius:9px;border:1px solid var(--line);background:var(--s2);text-align:center;font-size:15px}
.pr input:focus{outline:2px solid var(--acc);border-color:transparent}
.sw{width:46px;height:28px;border-radius:99px;background:var(--s3);position:relative;flex:none;transition:background .2s}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;transition:transform .2s}
.sw[aria-pressed=true]{background:var(--ok)}.sw[aria-pressed=true]::after{transform:translateX(18px)}
.x{width:28px;height:28px;border-radius:8px;background:var(--s3);color:#ff9a9a;flex:none}
.card{background:var(--s1);border:1px solid var(--line);border-radius:16px;padding:16px;margin-bottom:12px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:0 12px}@media(max-width:560px){.grid,.g2{grid-template-columns:1fr}}
.open{display:flex;align-items:center;justify-content:space-between;gap:12px;font-weight:700}
.toast{position:fixed;left:50%;bottom:24px;transform:translate(-50%,30px);opacity:0;background:#2a2a2a;border:1px solid var(--line);padding:11px 18px;border-radius:99px;font-weight:600;transition:.25s;z-index:60;pointer-events:none}
.toast.show{opacity:1;transform:translate(-50%,0)}.toast.bad{background:#5a2323}
.hint{color:var(--mut);font-size:13px;margin:6px 2px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}
.chip{display:inline-flex;align-items:center;gap:6px;padding:7px 12px;border-radius:99px;background:var(--s2);border:1px solid var(--line);font-size:13px;font-weight:600}
.chip:hover{border-color:var(--acc)}.chip[aria-pressed=true]{background:var(--acc);color:#1a0d05;border-color:var(--acc)}
.ov{position:fixed;inset:0;background:#000a;z-index:40;display:grid;place-items:center;padding:16px}
.md{width:min(480px,100%);max-height:92vh;overflow:auto;background:var(--s1);border:1px solid var(--line);border-radius:20px;padding:20px}
.md h4{margin:0 0 6px;font-size:20px}
.flex{display:flex;gap:10px;align-items:end}.flex>*{flex:1}.flex>.fit{flex:none}
.logo-prev{height:64px;max-width:240px;object-fit:contain;background:var(--s2);border-radius:12px;padding:8px;display:block;margin:6px 0}
.ready{display:grid;gap:10px}
.chip.today{padding:5px 10px;font-size:12px;color:var(--mut);white-space:nowrap}
.row .nm small.hint{display:inline}
.chip.today{padding:5px 10px;font-size:12px;color:var(--mut);white-space:nowrap}
.row .nm small.hint{display:inline}
.price-tag{font-weight:800;color:var(--acc)}
</style>
</head>
<body>
<div class="login" id="loginView" hidden>
  <form class="box" id="lf">
    <h1>Panel restauratora</h1><p>Zaloguj się, żeby zmienić menu i ceny.</p>
    <label class="f" for="em">E-mail</label><input class="in" id="em" type="email" autocomplete="username" required>
    <label class="f" for="pw">Hasło</label><input class="in" id="pw" type="password" autocomplete="current-password" required>
    <button class="btn w" id="lb" type="submit">Zaloguj</button><div class="err" id="le"></div>
  </form>
</div>
<div id="app" hidden>
  <div class="top"><h2>Panel</h2><select id="rs" aria-label="Lokal"></select><div class="r"><a class="btn g" id="seeSite" target="_blank" rel="noopener">Zobacz stronę</a><button class="btn g" id="out">Wyloguj</button></div></div>
  <div class="tabs" id="tabs"></div>
  <main id="main"></main>
</div>
<div class="toast" id="toast"></div>
