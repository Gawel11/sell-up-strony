 ctx.clearRect(0,0,CW,CH);
 /* steam */
 if(steam&&!RM){var rate=1.25*steam.k*dt;while(rate>0){if(Math.random()<rate)parts.push({k:'s',x:steam.x+R(-.5,.5)*steam.w*R(.35,1),y:steam.y+R(-BH*.035,BH*.025),vy:R(.6,1.15)*S,r:R(.06,.1)*BW,g:R(1.005,1.01),l:0,m:R(150,240),ph:R(0,6.28),am:R(.7,1.5)});rate-=1}}
 ctx.globalCompositeOperation='screen';
 for(var i=parts.length-1;i>=0;i--){var p=parts[i];if(p.k!=='s')continue;p.l+=dt;if(p.l>=p.m){parts.splice(i,1);continue}
  p.y-=p.vy*dt;p.x+=Math.sin(p.y*.022/S+p.ph+T*.012)*.55*p.am*S*dt;p.r*=Math.pow(p.g,dt);
  var lf=p.l/p.m,a=(lf<.15?lf/.15:Math.pow(1-(lf-.15)/.85,1.3))*.15*steam_k();
  ctx.globalAlpha=a;ctx.drawImage(puff,p.x-p.r*.55,p.y-p.r*1.15,p.r*1.1,p.r*2.3)}
 ctx.globalCompositeOperation='source-over';
 /* drizzle */
 if(drz){drz.l+=dt;if(drz.l>0){var tot=drz.y1-drz.y0;drz.len=Math.min(tot,drz.len+tot*.035*dt);var yA=drz.l>70?drz.y0+(drz.l-70)*tot*.03:drz.y0,yB=drz.y0+drz.len;if(yA<yB){var gr=ctx.createLinearGradient(drz.x-drz.w,0,drz.x+drz.w,0);gr.addColorStop(0,'rgba(0,0,0,0)');gr.addColorStop(.3,drz.col);gr.addColorStop(.55,'#fff8e8');gr.addColorStop(.75,drz.col);gr.addColorStop(1,'rgba(0,0,0,0)');ctx.globalAlpha=.92;ctx.fillStyle=gr;ctx.beginPath();ctx.moveTo(drz.x-drz.w*.5,yA);ctx.lineTo(drz.x+drz.w*.5,yA);ctx.lineTo(drz.x+drz.w*.5+Math.sin(T*.08)*.6,yB);ctx.arc(drz.x,yB,drz.w*.62,0,3.14);ctx.closePath();ctx.fill();ctx.globalAlpha=1}else drz=null}}
 /* toppings */
 for(i=parts.length-1;i>=0;i--){p=parts[i];if(p.k==='s')continue;p.l+=dt;if(p.l<0)continue;
  if(p.y<p.land){p.vy+=.06*S*dt;p.y+=p.vy*dt;p.x+=(p.vx+Math.sin(p.l*.11+p.sw)*.5*S)*dt;p.rot+=p.vr*dt+Math.sin(p.l*.07+p.sw)*.03}
  else{p.fade+=.014*dt;if(p.fade>=1){parts.splice(i,1);continue}}
  drawTop(p)}
}
function steam_k(){return 1}
/* ---------- sway + parallax ---------- */
var mx=0,my=0,smx=0,smy=0;
addEventListener('pointermove',function(e){if(e.pointerType!=='mouse')return;mx=(e.clientX/innerWidth-.5);my=(e.clientY/innerHeight-.5)});
function sway(dt){if(RM)return;smx+=(mx-smx)*.05*dt;smy+=(my-smy)*.05*dt;var t=T/60;
 var rx=1.6+1.1*Math.sin(t*.55)-smy*5,ry=-2.4*Math.sin(t*.4)+smx*7;
 book.style.transform='rotateX('+rx.toFixed(2)+'deg) rotateY('+ry.toFixed(2)+'deg) translateY('+(Math.sin(t*.55)*-3).toFixed(1)+'px)';
 book.style.setProperty('--px',(-ry*1.6).toFixed(1)+'px');book.style.setProperty('--py',(rx*1.2-2).toFixed(1)+'px')}
/* ---------- flow ---------- */
function vis(el,z){el.style.zIndex=z;el.classList.add('vis')}
function dotsHTML(i){var s='<div class="dots">';for(var j=0;j<D.length;j++)s+='<b class="'+(j===i?'on':'')+'"></b>';return s+'</div>'}
function ui(i){under.innerHTML=dotsHTML(i);$('#prev').classList.toggle('on',i>0);$('#next').classList.toggle('on',i<D.length-1)}
function play(i,delay){var d=D[i];parts=parts.filter(function(p){return false});drz=null;steam=null;
 setTimeout(function(){steamOn(d)},delay*16.7);toppings(d,delay+10);startDrizzle(d,delay+25)}
function open(){if(opened)return;opened=true;fit();vis(D[0].el,2);cover.classList.add('gone');cur=0;ui(0);play(0,40);
 setTimeout(function(){cover.style.visibility='hidden'},1500)}
function go(k){if(!opened||busy)return;var n=cur+k;if(n<0||n>=D.length)return;busy=true;
 var a=D[cur].el,b=D[n].el;steam=null;parts=[];drz=null;
 if(k>0){vis(a,3);vis(b,2);void a.offsetWidth;a.classList.add('gone');play(n,30)}
 else{vis(b,3);vis(a,2);void b.offsetWidth;b.classList.remove('gone');play(n,60)}
 cur=n;ui(n);
 setTimeout(function(){a.classList.remove('vis');b.style.zIndex=2;busy=false},1350)}
cover.addEventListener('click',open);
$('#prev').onclick=function(){go(-1)};$('#next').onclick=function(){go(1)};
var sx=null,sy=null,st=0;
addEventListener('touchstart',function(e){sx=e.touches[0].clientX;sy=e.touches[0].clientY;st=Date.now()},{passive:true});
addEventListener('touchend',function(e){if(sx===null)return;var dx=e.changedTouches[0].clientX-sx,dy=e.changedTouches[0].clientY-sy;sx=sy=null;
 if(!opened){if(Math.abs(dx)>30||Math.abs(dy)>30)open();return}
 if(Math.abs(dx)>Math.abs(dy)){if(Math.abs(dx)>35)go(dx<0?1:-1)}else if(Math.abs(dy)>35)go(dy<0?1:-1)},{passive:true});
var wt=0;addEventListener('wheel',function(e){var t=Date.now();if(t-wt<1100||Math.abs(e.deltaY)<10)return;wt=t;if(!opened){open();return}go(e.deltaY>0?1:-1)},{passive:true});
addEventListener('keydown',function(e){if(!opened&&(e.key==='Enter'||e.key===' '||e.key==='ArrowRight')){open();return}
 if(e.key==='ArrowRight'||e.key==='ArrowDown'||e.key==='PageDown')go(1);if(e.key==='ArrowLeft'||e.key==='ArrowUp'||e.key==='PageUp')go(-1)});
addEventListener('resize',function(){fit();if(cur>=0)steamOn(D[cur])});
function add(n,p){var c=cart[n]||(cart[n]={q:0,p:p});c.q++;sum();toast('Dodano: '+n)}
function sum(){var q=0,s=0;for(var k in cart){q+=cart[k].q;s+=cart[k].q*cart[k].p}$('#bsum').textContent='Zamówienie: '+q+' szt. · '+s+' zł';$('#bar').classList.toggle('on',q>0)}
var tt;function toast(m){var t=$('#toast');t.textContent=m;t.classList.add('on');clearTimeout(tt);tt=setTimeout(function(){t.classList.remove('on')},1600)}
$('#order').onclick=function(){toast('To prototyp – zamówienia włączymy po podłączeniu do bazy')};
D.forEach(function(d){var im=new Image();im.src=d.f});
fit();requestAnimationFrame(tick);
window.__menu={go:go,open:open,state:function(){return {cur:cur,opened:opened,parts:parts.length,box:[BW,BH]}}};
